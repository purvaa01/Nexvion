---
- name: Configure Nexvion environment
  hosts: local
  connection: local
  become: false

  tasks:
    - name: Install required system packages
      ansible.builtin.apt:
        name:
          - curl
        state: present
        update_cache: false

    - name: Ensure Docker service is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Ensure Nexvion user exists
      ansible.builtin.user:
        name: purvaa
        state: present
        shell: /bin/bash

    - name: Create Nexvion application directory
      ansible.builtin.file:
        path: /opt/nexvion
        state: directory
        owner: purvaa
        group: purvaa
        mode: '0755'

    - name: Create Nexvion configuration file
      ansible.builtin.copy:
        dest: /opt/nexvion/nexvion.conf
        content: |
          APPLICATION_NAME=Nexvion
          APPLICATION_PORT=80
          ENVIRONMENT=local
        owner: purvaa
        group: purvaa
        mode: '0644'

    - name: Ensure Nginx service is running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true