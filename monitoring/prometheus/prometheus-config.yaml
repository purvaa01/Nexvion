
  apiVersion: v1
  kind: ConfigMap
  metadata:
    name: nexvion-prometheus-config
    namespace: monitoring
  data:
    prometheus.yml: |
      global:
        scrape_interval: 15s
      
      scrape_configs:
        - job_name: "nexvion-kubernetes"
          kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_label_app]
              regex: nexvion
              action: keep
