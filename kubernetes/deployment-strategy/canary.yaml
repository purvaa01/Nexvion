apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexvion-canary
  namespace: nexvion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexvion
      version: canary
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: nexvion
        version: canary
    spec:
      containers:
        - name: nexvion
          image: purvaawankhede/nexvion:latest
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: nexvion-canary-service
  namespace: nexvion
spec:
  selector:
    app: nexvion
    version: canary
  ports:
    - port: 80
      targetPort: 80
  type: NodePort
