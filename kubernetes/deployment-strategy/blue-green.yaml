apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexvion-green
  namespace: nexvion
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexvion
      version: green
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: nexvion
        version: green
    spec:
      containers:
        - name: nexvion
          image: purvaawankhede/nexvion:latest
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: nexvion-green-service
  namespace: nexvion
spec:
  selector:
    app: nexvion
    version: green
  ports:
    - port: 80
      targetPort: 80
  type: NodePort
